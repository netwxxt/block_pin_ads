# /etc/wireguard/wg0.conf
# Place this file at /etc/wireguard/wg0.conf on the server.
# Permissions: sudo chmod 600 /etc/wireguard/wg0.conf

[Interface]
Address = 10.13.0.1/24
ListenPort = <your chosen UDP port>
PrivateKey = <contents of /etc/wireguard/server_private.key>

PostUp   = iptables -t nat -A PREROUTING -i wg0 -p tcp -j REDIRECT --to-port 8080
PostUp   = iptables -A FORWARD -i wg0 -p udp --dport 443 -j REJECT
PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT
PostUp   = iptables -A FORWARD -o wg0 -j ACCEPT
PostUp   = iptables -t nat -A POSTROUTING -o <LAN interface> -j MASQUERADE
PostDown = iptables -t nat -D PREROUTING -i wg0 -p tcp -j REDIRECT --to-port 8080
PostDown = iptables -D FORWARD -i wg0 -p udp --dport 443 -j REJECT
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT
PostDown = iptables -D FORWARD -o wg0 -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o <LAN interface> -j MASQUERADE

[Peer]
# Device 1
PublicKey = <contents of /etc/wireguard/device1_public.key>
AllowedIPs = 10.13.0.2/32

[Peer]
# Device 2
PublicKey = <contents of /etc/wireguard/device2_public.key>
AllowedIPs = 10.13.0.3/32

# Add more [Peer] blocks for additional devices (10.13.0.4/32, etc.)
